<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Clip app icon: ink squircle, acid viewfinder brackets, an off-centre
       solid frame and a coral record dot. Hard geometry, one accent. -->
  <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="#0E0E11"/>

  <!-- Viewfinder brackets -->
  <g fill="#CCFF00">
    <!-- top-left -->
    <rect x="236" y="236" width="196" height="54"/>
    <rect x="236" y="236" width="54" height="196"/>
    <!-- top-right -->
    <rect x="592" y="236" width="196" height="54"/>
    <rect x="734" y="236" width="54" height="196"/>
    <!-- bottom-left -->
    <rect x="236" y="734" width="196" height="54"/>
    <rect x="236" y="592" width="54" height="196"/>
    <!-- bottom-right -->
    <rect x="592" y="734" width="196" height="54"/>
    <rect x="734" y="592" width="54" height="196"/>
  </g>

  <!-- Captured frame, pushed off centre -->
  <rect x="446" y="446" width="260" height="260" fill="#CCFF00"/>
  <rect x="500" y="500" width="152" height="152" fill="#0E0E11"/>

  <!-- Record dot -->
  <circle cx="366" cy="366" r="46" fill="#FF4D2E"/>
</svg>
